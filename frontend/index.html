<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link id="nq-manifest" rel="manifest" href="/manifest.webmanifest" />
    <meta id="nq-theme" name="theme-color" content="#02040F" />
    <!-- NORQVA-0105: viewport-fit=cover deixa o app desenhar até a borda de baixo (atrás da barra do Android);
         a barra de áreas compensa com env(safe-area-inset-bottom). color-scheme pede barras do sistema escuras. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta id="nq-scheme" name="color-scheme" content="dark" />
    <title>NORQVA Intelligence & Performance</title>
    <style>
      /* NORQVA-0099: antes do app carregar, o mesmo fundo e triângulo da abertura (nada de tela clara ou antiga) */
      html, body { background: #02040F; }
      #nq-boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #02040F; }
      #nq-boot svg { filter: drop-shadow(0 0 14px rgba(220,226,234,0.45)); animation: nqBoot 1.6s ease-in-out infinite; }
      @keyframes nqBoot { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #nq-boot svg { animation: none; } }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased">
    <div id="root"><div id="nq-boot" aria-hidden="true"><svg viewBox="0 0 120 120" width="96" height="96"><path d="M60 10 L104 86 L16 86 Z" fill="rgba(167,175,188,0.06)" stroke="#C9CFD9" stroke-width="6"/><circle cx="60" cy="10" r="4" fill="#F4F6F9"/></svg></div></div>
    <script>
      // páginas do comprador (livro, kit, pedido, acesso, página gerada): sem a marca interna, sem barra escura e sem instalar o painel
      (function () {
        if (!/^\/(p|kit|pedido|acesso|v)\//.test(location.pathname)) return;
        var b = document.getElementById('nq-boot'); if (b) b.parentNode.removeChild(b);
        var m = document.getElementById('nq-manifest'); if (m) m.parentNode.removeChild(m);
        var t = document.getElementById('nq-theme'); if (t) t.setAttribute('content', '#FAF7F2');
        var cs = document.getElementById('nq-scheme'); if (cs) cs.setAttribute('content', 'light');
        document.documentElement.style.background = '#FAF7F2';
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
