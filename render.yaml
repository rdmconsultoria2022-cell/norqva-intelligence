services:
  - type: web
    name: norqva-staging-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: real
      - key: APP_ENV
        value: staging
      - key: ASAAS_ENV
        value: sandbox
      - key: ASAAS_BASE_URL
        value: https://api-sandbox.asaas.com/v3
      - key: SEED_DEMO_DATA
        value: false
      - key: TRUST_PROXY
        value: 1
      - key: DATABASE_URL
        fromDatabase:
          name: norqva-staging-db
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_AUTH_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: norqva-staging-db
    databaseName: norqva_staging
    user: norqva_user
    plan: starter
    postgresMajorVersion: 16
