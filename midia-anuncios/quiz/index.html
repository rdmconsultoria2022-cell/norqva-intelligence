const alvo = () => { const w=num('w'); return w ? Math.round((w-perda())*10)/10 : ''; };
const dataFim = () => { const d=new Date(); d.setDate(d.getDate()+21); return d; };
const fmtD = d => d.toLocaleDateString('pt-BR',{day:'numeric',month:'short'}).replace('.','');
const trava = () => { const h=S.m.habitos||[], o=S.m.objetivos||[]; if(h.includes('Como por ansiedade')||h.includes('Ataco a geladeira à noite')) return 'Fome Emocional'; if(['Só café ou chá','1 a 2 copos'].includes(S.a.agua)||o.includes('Desinchar')) return 'Inchaço Crônico'; return 'Metabolismo Lento'; };
const travaInfo = () => {
  const t=trava(), b=[];
  (S.m.vontades||[]).length && b.push(`Vontade frequente de ${(S.m.vontades||[]).map(x=>x.toLowerCase()).join(', ')}`);
  (S.m.habitos||[]).filter(x=>x!=='Nenhum deles').length && b.push(`Hábito: ${(S.m.habitos||[]).filter(x=>x!=='Nenhum deles')[0].toLowerCase()}`);
  ['Só café ou chá','1 a 2 copos'].includes(S.a.agua) && b.push('Pouca água: o corpo segura líquido e incha');
  ['Menos de 5 horas','5 a 6 horas'].includes(S.a.sono) && b.push('Sono curto aumenta a fome no dia seguinte');
  if(b.length<3) b.push('Refeições sem proteína suficiente para dar saciedade');
  const why = { 'Fome Emocional':'A fome não vem do estômago, vem da cabeça. Por isso as dietas duram 3 dias.', 'Inchaço Crônico':'Boa parte do volume da sua barriga é retenção. Ela sai rápido com o cardápio certo.', 'Metabolismo Lento':'Comer pouco e errado fez o corpo economizar energia. Ele precisa voltar a queimar.' }[t];
  const pct = 60 + Math.min(25, b.length*6 + (imc()>30?6:0));
  return {t, why, b:b.slice(0,3), pct};
};
const nome1 = () => (S.lead.nome||'').trim().split(/\s+/)[0] || '';
const cupom = () => (nome1().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z]/g,'').toUpperCase() || 'SECA') + '62';

/* Envio de lead */
function sendLead(etapa){
  const payload = Object.assign({ sessao:SESSION, etapa, data:new Date().toISOString(), nome:S.lead.nome||'', email:S.lead.email||'', whatsapp:S.lead.whats||'',
    idade:S.a.age||'', faixa:S.a.idade||'', altura:S.a.h||'', peso:S.a.w||'', meta:S.a.gw||'', imc:imc()?imc().toFixed(1):'', tipo:tipo(), trava:trava(), perda_estimada:perda(),
    evento:S.a.evento||'', respostas:JSON.stringify(Object.assign({},S.a,S.m)), pagina:location.href.split('?')[0] }, UTM);
  try{ localStorage.setItem('norqva_lead', JSON.stringify(payload)); }catch(e){}
  if(!C.LEAD_WEBHOOK) return;
  try{ fetch(C.LEAD_WEBHOOK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),keepalive:true}); }catch(e){}
}

/* Render */
const screenEl=$('#screen'), nextBtn=$('#next'), foot=$('#foot'), backBtn=$('#back');
function progress(){ const s=SCREENS[S.i]; const bars=[...document.querySelectorAll('#prog i')]; bars.forEach((b,n)=>{ const tot=SCREENS.filter(x=>x.sec===n).length; const done=SCREENS.slice(0,S.i+1).filter(x=>x.sec===n).length; b.style.width = (n<s.sec?100:n>s.sec?0:Math.round(done/tot*100))+'%'; }); }
function setBtn(label, enabled, cls){ nextBtn.textContent=label; nextBtn.disabled=!enabled; nextBtn.className='btn'+(cls?' '+cls:''); foot.style.display=''; }
function hideBtn(){ foot.style.display='none'; }

function render(){
  const s=SCREENS[S.i]; progress(); backBtn.classList.toggle('hide', S.i===0 || ['load','offer'].includes(s.k));
  const h=[]; const secNames=['Seu perfil','Sua rotina','Seus hábitos','Sua meta','Seu plano'];
  if(s.k!=='hero') h.push(`<div class="sec">${secNames[s.sec]}</div>`);
  const title = s.titleFn ? s.titleFn() : s.title;
  switch(s.k){
   case 'hero':
    h.push(`<div class="hero"><span class="kick">QUIZ GRÁTIS · 2 MINUTOS</span><h1>Descubra o seu tipo de barriga e perca até 7 kg em 21 dias</h1><p class="sub">Comendo comida de verdade, sem passar fome. Toque abaixo para começar:</p>
     <div class="hero-pick"><div class="opt" data-v="Mulher">${svgPerson('f')}Sou mulher<span class="go">Começar →</span></div><div class="opt" data-v="Homem">${svgPerson('m')}Sou homem<span class="go">Começar →</span></div></div>
     <div class="badge-row" style="margin-top:16px"><span><b>21 dias</b> de cardápio</span><span><b>150</b> receitas</span><span><b>até 20 min</b> por prato</span></div>
     <p class="legal">Ao continuar você concorda com o uso dos seus dados para montar seu plano.</p></div>`);
    hideBtn(); break;
   case 'single':
    h.push(`<h2>${esc(title)}</h2>${s.sub?`<p class="sub">${esc(s.sub)}</p>`:'<div style="height:14px"></div>'}<div class="opts">${s.opts.map(o=>`<div class="opt${S.a[s.key]===o?' on':''}" data-v="${esc(o)}"><span class="box">${S.a[s.key]===o?'✓':''}</span>${esc(o)}</div>`).join('')}</div>`);
    hideBtn(); break;
   case 'multi': {
    const sel=S.m[s.key]||[];
    h.push(`<h2>${esc(title)}</h2><p class="sub">${esc(s.sub||'')}</p><div class="opts">${s.opts.map(o=>`<div class="opt multi${sel.includes(o)?' on':''}" data-v="${esc(o)}"><span class="box">${sel.includes(o)?'✓':''}</span>${esc(o)}</div>`).join('')}</div>`);
    setBtn('Próximo passo', sel.length>0); break; }
   case 'info': h.push(infoHTML(s.id)); setBtn('Continuar', true); break;
   case 'num':
    h.push(`<h2>${esc(title)}</h2><div style="height:14px"></div><div class="field"><input id="numin" type="number" inputmode="decimal" placeholder="${s.ph}" value="${esc(S.a[s.key]||'')}"><span>${s.unit}</span></div><div class="err" id="err"></div><div id="numnote"></div>`);
    setBtn('Continuar', !!S.a[s.key]); break;
   case 'date':
    h.push(`<h2>${esc(title)}</h2><p class="sub">${esc(s.sub)}</p><div class="field"><input id="datein" class="small" type="date" value="${esc(S.a.data||'')}"></div>`);
    setBtn('Continuar', true); break;
   case 'profile': {
    const v=imc(), pct=Math.max(4,Math.min(96,(v-15)/25*100));
    h.push(`<h2>Aqui está o seu perfil metabólico</h2><div style="height:10px"></div><div class="imc"><div style="font-weight:600">Índice de Massa Corporal (IMC)</div>
     <div class="imc-bar"><div class="imc-tag" style="left:${pct}%">O seu: ${v.toFixed(1).replace('.',',')}</div><div class="imc-dot" style="left:${pct}%"></div></div>
     <div class="imc-lbl"><span>Abaixo</span><span>Normal</span><span>Acima</span><span>Obesidade</span></div>
     ${v>=25?`<div class="risk"><b>Atenção:</b> IMC acima de 25 está ligado a gordura abdominal, inchaço, cansaço e resistência à insulina.</div>`:''}
     <div class="rows"><div>Metabolismo<b>${tipo()}</b></div><div>Classificação<b>${imcTxt(v)}</b></div><div>Tempo para cozinhar<b>${esc(S.a.tempo||'-')}</b></div><div>Rotina<b>${esc(S.a.rotina||'-')}</b></div></div></div>`);
    setBtn('Continuar', true); break; }
   case 'chart': {
    const w=num('w'), a=alvo(), ev=S.a.evento&&S.a.evento!=='Nada marcado' ? S.a.evento.toLowerCase() : '';
    h.push(`<h2>O plano que finalmente vai colocar você em forma</h2><p class="sub">Estimamos que você chegue a <b>${String(a).replace('.',',')} kg</b> até <b>${fmtD(dataFim())}</b>.</p>
     <div class="chart">${svgChart(w,a)}<div style="text-align:center"><span class="pill">~${perda()} kg ${ev?'até '+esc(ev):'em 21 dias'}</span></div></div>
     <p class="disc">*Estimativa baseada nas suas respostas e na média de quem seguiu o cardápio. Resultados individuais variam. Consulte um profissional de saúde antes de começar.</p>`);
    setBtn('Continuar', true); break; }
   case 'load':
    h.push(`<h2>Montando seu cardápio de 21 dias…</h2><div class="ring"><svg viewBox="0 0 120 120" width="170" height="170"><circle cx="60" cy="60" r="52" fill="none" stroke="#E3DACB" stroke-width="10"/><circle id="ringc" cx="60" cy="60" r="52" fill="none" stroke="#2F5D3A" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg><div class="pct" id="pct">0%</div></div>
     <p class="sub" id="loadtxt">Analisando seu perfil metabólico</p>
     <div class="quote" id="lq">Cardápio de cada refeição, com a comida que a família já come.<b>Desafio Seca Barriga</b></div>`);
    hideBtn(); setTimeout(runLoad,50); break;
   case 'capture':
    h.push(`<h2>Seu cardápio está pronto! Para onde enviamos?</h2><p class="sub">Digite seu nome e e-mail para receber o seu Plano Seca Barriga personalizado.</p>
     <div class="field"><input id="nomein" class="small" type="text" autocomplete="given-name" placeholder="Seu primeiro nome" value="${esc(S.lead.nome||'')}"></div>
     <div class="field"><input id="emailin" class="small" type="email" autocomplete="email" inputmode="email" placeholder="Seu melhor e-mail" value="${esc(S.lead.email||'')}"></div>
     <div class="err" id="err"></div><p class="legal">Respeitamos sua privacidade. Seus dados são usados só para montar e entregar seu plano.</p>`);
    setBtn('Continuar', true); break;
   case 'whats':
    h.push(`<h2>Digite seu WhatsApp para liberar o resultado</h2><p class="sub">Você também recebe o cardápio do dia direto no celular.</p>
     <div class="field"><span style="margin-right:8px">+55</span><input id="whatsin" class="small" type="tel" autocomplete="tel-national" inputmode="tel" placeholder="(11) 99999-9999" value="${esc(S.lead.whats||'')}"></div>
     <div class="err" id="err"></div>`);
    setBtn('Liberar meu resultado', true); break;
   case 'plan': {
    const ut=(S.m.utensilios||[]).filter(x=>x!=='Só fogão').map(x=>x.toLowerCase());
    h.push(`<h2>${esc(nome1()?nome1()+', seu':'Seu')} Desafio Seca Barriga 21 Dias</h2><div style="height:12px"></div><ul class="plan">
     <li><i>1</i><span><b>Meta: ${perda()} kg em 21 dias</b>De ${String(num('w')).replace('.',',')} kg para ${String(alvo()).replace('.',',')} kg até ${fmtD(dataFim())}</span></li>
     <li><i>2</i><span><b>Cardápio para metabolismo ${tipo()}</b>Fase Desincha, fase Queima e fase Firma</span></li>
     <li><i>3</i><span><b>Pratos de ${esc((S.a.tempo||'').toLowerCase().replace('cozinho no fim de semana e congelo','preparo no fim de semana'))}</b>${ut.length?'Receitas para '+esc(ut.join(', ')):'Receitas só no fogão'}</span></li>
     <li><i>4</i><span><b>Mercado ${esc((S.a.orcamento||'').toLowerCase())} por semana</b>Lista de compras pronta para cada semana</span></li></ul>`);
    setBtn('Ver meu diagnóstico', true); break; }
   case 'diag': {
    const d=travaInfo();
    h.push(`<h2>Encontramos o que trava o seu emagrecimento</h2><div style="height:12px"></div><div class="diag"><div style="text-align:center;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.06em">SUA TRAVA</div><div class="name">${d.t}</div>
     <div class="meter"><i id="meter"></i></div><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted)"><span>Leve</span><span>Intensidade: ${d.pct}%</span><span>Alta</span></div>
     <p style="margin-top:14px;font-size:15px">${d.why}</p><ul>${d.b.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
     <p style="margin-top:10px;font-size:15px;font-weight:600">A boa notícia: seu cardápio de 21 dias já foi montado para destravar isso.</p></div>`);
    setBtn('Continuar', true); setTimeout(()=>{const m=$('#meter'); if(m) m.style.width=d.pct+'%';},80); break; }
   case 'scratch':
    h.push(`<h2>${S.revealed?'Desconto liberado!':'Raspe para revelar seu desconto'}</h2><p class="sub">${S.revealed?'Aplicado automaticamente na sua oferta':'Queremos que você comece com uma boa surpresa'}</p>
     <div class="scratch"><div class="prize"><b>62% OFF</b><small>no Desafio Seca Barriga 21 Dias</small><span class="code">${esc(cupom())}</span></div>${S.revealed?'':'<canvas id="sc"></canvas>'}</div>
     <p class="legal">${S.revealed?'Toque em continuar para ver sua oferta com o desconto aplicado.':'Arraste o dedo sobre o cartão.'}</p>`);
    setBtn(S.revealed?'Ver minha oferta':'Raspe para continuar', S.revealed, S.revealed?'accent':''); break;
   case 'offer': h.push(offerHTML()); setBtn('Garantir meu acesso', true, 'accent'); break;
  }
  screenEl.innerHTML=`<div class="fade">${h.join('')}</div>`; window.scrollTo(0,0);
  bind(s);
  track('QuizStep',{step:S.i, tela:s.key||s.k||s.id||'', bloco:s.sec}, true);
}

}

   <div class="faq"><details><summary>Preciso fazer academia?</summary><p>Não. O desafio é baseado no cardápio. Se você já se exercita, continue: o resultado aparece mais rápido.</p></details><details><summary>Vou passar fome?</summary><p>Não. Toda refeição tem proteína e volume de legumes para dar saciedade. Você come 4 a 5 vezes por dia.</p></details><details><summary>Serve para quem tem pouco tempo?</summary><p>Sim. As receitas ficam prontas em até 20 minutos, e há opções para cozinhar no fim de semana e congelar.</p></details><details><summary>Como recebo?</summary><p>Logo após o pagamento você recebe o acesso por e-mail e WhatsApp, com tudo em PDF para ver no celular ou imprimir.</p></details></div>
   <p class="disc">*Resultados individuais variam e dependem de seguir o cardápio. Este material não substitui acompanhamento médico ou nutricional. Consulte um profissional de saúde antes de começar.</p>`;
}

function svgPerson(g){ return g==='f'
 ? `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="31" fill="#F7E3DC"/><path d="M17 44c-1-6 0-14 2-20 2-8 7-13 13-13s11 5 13 13c2 6 3 14 2 20z" fill="#4A3426"/><rect x="28" y="34" width="8" height="9" rx="3" fill="#E2A97E"/><circle cx="32" cy="26" r="10" fill="#E9B48F"/><path d="M21 27c0-9 5-14 11-14s11 5 11 14c-3-5-8-8-14-7-3 1-6 3-8 7z" fill="#4A3426"/><path d="M11 60c2-11 10-17 21-17s19 6 21 17c-6 3-13 4-21 4s-15-1-21-4z" fill="#C8553D"/><path d="M26 43c2 4 4 5 6 5s4-1 6-5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>`
 : `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="31" fill="#E6EFE6"/><rect x="28" y="33" width="8" height="10" rx="3" fill="#E2A97E"/><circle cx="32" cy="25" r="10" fill="#E9B48F"/><path d="M21.5 24c-1-8 4-13 10.5-13s11.5 4 10.5 13c-1-3-3-5-5-5-3 1-8 1-11 0-2 0-4 2-5 5z" fill="#4A3426"/><path d="M10 60c2-11 10-17 22-17s20 6 22 17c-6 3-14 4-22 4s-16-1-22-4z" fill="#2F5D3A"/><path d="M27 43l5 6 5-6z" fill="#fff"/></svg>`; }

function svgChart(w,a){
 const x0=30,x1=330,y0=30,y1=150; const pts=[[x0,y0],[110,y0+40],[200,y0+82],[x1,y1]];
 const d=`M${pts[0][0]} ${pts[0][1]} C 90 ${y0+10}, 130 ${y0+70}, 200 ${y0+82} S 300 ${y1-4}, ${x1} ${y1}`;
 return `<svg viewBox="0 0 360 200"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C8553D" stop-opacity=".25"/><stop offset="1" stop-color="#2F5D3A" stop-opacity=".05"/></linearGradient></defs>
  <line x1="30" x2="330" y1="170" y2="170" stroke="#E3DACB"/><path d="${d} L ${x1} 170 L ${x0} 170 Z" fill="url(#g)"/><path d="${d}" fill="none" stroke="#2F5D3A" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="${x0}" cy="${y0}" r="7" fill="#C8553D"/><circle cx="${x1}" cy="${y1}" r="7" fill="#2F5D3A"/>
  <rect x="${x0-6}" y="${y0-26}" width="70" height="22" rx="6" fill="#1F2A22"/><text x="${x0+29}" y="${y0-11}" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">${String(w).replace('.',',')} kg</text>
  <rect x="${x1-70}" y="${y1-34}" width="70" height="22" rx="6" fill="#2F5D3A"/><text x="${x1-35}" y="${y1-19}" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">${String(a).replace('.',',')} kg</text>
  <text x="${x0}" y="190" fill="#5E6B61" font-size="11.5">Você hoje</text><text x="${x1}" y="190" fill="#5E6B61" font-size="11.5" text-anchor="end">Em 21 dias</text></svg>`;
}

function runLoad(){
 const msgs=['Analisando seu perfil metabólico','Separando receitas para o seu tempo','Ajustando ao seu orçamento','Montando as 3 fases do desafio'];
 const quotes=[['Cardápio de cada refeição, com a comida que a família já come.','Desafio Seca Barriga'],['Receitas prontas em até 20 minutos e lista de compras da semana.','Desafio Seca Barriga']];
 let p=0; const iv=setInterval(()=>{ p+=1.25; const c=$('#ringc'), t=$('#pct'); if(!c){clearInterval(iv);return;} c.style.strokeDashoffset=326.7-326.7*p/100; t.textContent=Math.round(p)+'%'; $('#loadtxt').textContent=msgs[Math.min(3,Math.floor(p/25))]; const q=quotes[Math.floor(p/50)%2]; $('#lq').innerHTML=esc(q[0])+'<b>'+esc(q[1])+'</b>'; if(p>=100){clearInterval(iv); setTimeout(()=>go(1),500);} },100);
}

function initScratch(){
 const cv=$('#sc'); if(!cv) return; const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1; cv.width=r.width*dpr; cv.height=r.height*dpr; const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
 const g=ctx.createLinearGradient(0,0,r.width,r.height); g.addColorStop(0,'#BDB3A3'); g.addColorStop(.5,'#E3DACB'); g.addColorStop(1,'#BDB3A3'); ctx.fillStyle=g; ctx.fillRect(0,0,r.width,r.height);
 ctx.fillStyle='#5E6B61'; ctx.font='600 16px Inter,sans-serif'; ctx.textAlign='center'; ctx.fillText('RASPE AQUI',r.width/2,r.height/2+6);
 ctx.globalCompositeOperation='destination-out'; let down=false, n=0;
 const pos=e=>{const b=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return [t.clientX-b.left,t.clientY-b.top];};
 const erase=e=>{ if(!down) return; e.preventDefault(); const [x,y]=pos(e); ctx.beginPath(); ctx.arc(x,y,24,0,Math.PI*2); ctx.fill(); if(++n%8===0) check(); };
 const check=()=>{ const d=ctx.getImageData(0,0,cv.width,cv.height).data; let c=0; for(let i=3;i<d.length;i+=64) if(d[i]===0) c++; if(c/(d.length/64)>.5) reveal(); };
 const reveal=()=>{ if(S.revealed) return; S.revealed=true; track('ScratchRevealed',{},true); render(); };
 cv.addEventListener('pointerdown',e=>{down=true;erase(e);}); cv.addEventListener('pointermove',erase); window.addEventListener('pointerup',()=>{down=false;});
 cv.addEventListener('touchstart',e=>{down=true;erase(e);},{passive:false}); cv.addEventListener('touchmove',erase,{passive:false}); cv.addEventListener('touchend',()=>{down=false;});
}

let timerIv=null;
function startTimer(){ if(!S.t0) S.t0=Date.now(); clearInterval(timerIv); timerIv=setInterval(()=>{ const el=$('#timer'); if(!el){clearInterval(timerIv);return;} const left=Math.max(0,C.TIMER_MIN*60-Math.floor((Date.now()-S.t0)/1000)); el.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0'); },250); }

function checkoutUrl(){
 if(!C.CHECKOUT_URL) return null; let u; try{ u=new URL(C.CHECKOUT_URL); }catch(e){ return C.CHECKOUT_URL; }
 S.lead.nome && u.searchParams.set('name', S.lead.nome); S.lead.email && u.searchParams.set('email', S.lead.email); S.lead.whats && u.searchParams.set('phone', S.lead.whats.replace(/\D/g,''));
 Object.entries(UTM).forEach(([k,v])=>u.searchParams.set(k,v)); u.searchParams.set('src', SESSION); return u.toString();
}

function bind(s){
 screenEl.querySelectorAll('.opt').forEach(el=>el.addEventListener('click',()=>{
  const v=el.dataset.v;
  if(s.k==='hero'){ S.a.sexo=v; track('ViewContent',{content_name:'Quiz Seca Barriga',content_category:'quiz_inicio'}); go(1); return; }
  if(s.k==='single'){ S.a[s.key]=v; render(); setTimeout(()=>{ if(s.key==='evento' && v==='Nada marcado') go(2); else go(1); },220); return; }
  if(s.k==='multi'){ let sel=S.m[s.key]||[]; if(s.none && v===s.none) sel = sel.includes(v)?[]:[v]; else { sel=sel.filter(x=>x!==s.none); sel = sel.includes(v)?sel.filter(x=>x!==v):sel.concat(v); } S.m[s.key]=sel; render(); }
 }));
 if(s.k==='num'){ const inp=$('#numin'); inp.focus(); inp.addEventListener('input',()=>{ S.a[s.key]=inp.value; nextBtn.disabled=!inp.value; $('#err').textContent=''; numNote(s); }); numNote(s); }
 if(s.k==='scratch' && !S.revealed) setTimeout(initScratch,30);
 if(s.k==='offer'){ startTimer(); track('ViewContent',{content_name:'Oferta Seca Barriga 21 Dias',content_category:'oferta',value:C.PRECO,currency:C.MOEDA}); sendLead('oferta'); }
}

function numNote(s){
 const box=$('#numnote'); if(!box) return; let t='';
 if(s.key==='w'){ const v=imc(); if(v) t = v>=25 ? `<div class="note"><b>Seu IMC é ${v.toFixed(1).replace('.',',')}</b>Está acima do ideal. O desafio foi feito exatamente para isso: secar a barriga sem passar fome.</div>` : `<div class="note" style="background:var(--green-soft)"><b>Seu IMC é ${v.toFixed(1).replace('.',',')}</b>Você está no peso normal. O foco vai ser desinchar e secar a barriga.</div>`; }
 if(s.key==='gw'){ const w=num('w'), g=num('gw'); if(w&&g&&g<w) t=`<div class="note" style="background:var(--green-soft)"><b>Meta: perder ${String(Math.round((w-g)*10)/10).replace('.',',')} kg</b>Os primeiros quilos vêm já no desafio de 21 dias.</div>`; }
 box.innerHTML=t;
}

function validNum(s){ const v=num(s.key); if(!(v>=s.min && v<=s.max)){ $('#err').textContent=`Digite um valor entre ${s.min} e ${s.max} ${s.unit}.`; return false; } if(s.key==='gw' && v>=num('w')){ $('#err').textContent='O peso desejado precisa ser menor que o atual.'; return false; } return true; }

nextBtn.addEventListener('click',()=>{
 const s=SCREENS[S.i];
 if(s.k==='num' && !validNum(s)) return;
 if(s.k==='date'){ S.a.data=$('#datein').value||''; }
 if(s.k==='capture'){
  const n=$('#nomein').value.trim(), e=$('#emailin').value.trim();
  if(n.length<2){ $('#err').textContent='Digite seu nome.'; return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)){ $('#err').textContent='Digite um e-mail válido.'; return; }
  S.lead.nome=n; S.lead.email=e.toLowerCase(); sendLead('email');
 }
 if(s.k==='whats'){
  const w=$('#whatsin').value.replace(/\D/g,''); if(w.length<10||w.length>11){ $('#err').textContent='Digite seu WhatsApp com DDD.'; return; }
  S.lead.whats='55'+w; sendLead('lead');
  if(window.fbq && C.PIXEL_ID){ try{ fbq('init', C.PIXEL_ID, {em:S.lead.email, ph:S.lead.whats, fn:nome1().toLowerCase(), external_id:SESSION}); }catch(e){} }
  track('Lead',{content_name:'Quiz Seca Barriga',value:C.PRECO,currency:C.MOEDA, tipo:tipo(), trava:trava()}, false, 'lead-'+SESSION);
  track('CompleteRegistration',{content_name:'Quiz Seca Barriga'}, false, 'reg-'+SESSION);
 }
 if(s.k==='offer'){
  track('InitiateCheckout',{value:C.PRECO,currency:C.MOEDA,content_name:'Desafio Seca Barriga 21 Dias',num_items:1}, false, 'ic-'+SESSION);
  sendLead('checkout');
  const u=checkoutUrl(); if(u){ setTimeout(()=>{ location.href=u; },250); } else { alert('Configure CHECKOUT_URL no topo do arquivo.'); }
  return;
 }
 go(1);
});
backBtn.addEventListener('click',()=>go(-1));

function go(d){
 let i=S.i+d;
 if(d<0){ while(i>0 && ['load','info'].includes(SCREENS[i].k) && SCREENS[i].id!=='tipo') i--; if(SCREENS[i] && SCREENS[i].k==='date' && S.a.evento==='Nada marcado') i--; }
 S.i=Math.max(0,Math.min(SCREENS.length-1,i)); render();
}

render();
})();
</script>
