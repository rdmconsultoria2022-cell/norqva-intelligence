 ctx.globalCompositeOperation='destination-out'; let down=false, n=0;
 const pos=e=>{const b=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return [t.clientX-b.left,t.clientY-b.top];};
 const erase=e=>{ if(!down) return; e.preventDefault(); const [x,y]=pos(e); ctx.beginPath(); ctx.arc(x,y,24,0,Math.PI*2); ctx.fill(); if(++n%8===0) check(); };
 const check=()=>{ const d=ctx.getImageData(0,0,cv.width,cv.height).data; let c=0; for(let i=3;i<d.length;i+=64) if(d[i]===0) c++; if(c/(d.length/64)>.5) reveal(); };
 const reveal=()=>{ if(S.revealed) return; S.revealed=true; track('ScratchRevealed',{},true); render(); };
 cv.addEventListener('pointerdown',e=>{down=true;erase(e);}); cv.addEventListener('pointermove',erase); window.addEventListener('pointerup',()=>{down=false;});
 cv.addEventListener('touchstart',e=>{down=true;erase(e);},{passive:false}); cv.addEventListener('touchmove',erase,{passive:false}); cv.addEventListener('touchend',()=>{down=false;});
}

let timerIv=null;
function startTimer(){ if(!S.t0) S.t0=Date.now(); clearInterval(timerIv); timerIv=setInterval(()=>{ const el=$('#timer'); if(!el){clearInterval(timerIv);return;} const left=Math.max(0,C.TIMER_MIN*60-Math.floor((Date.now()-S.t0)/1000)); el.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0'); },250); }

function checkoutUrl(){
 if(!C.CHECKOUT_URL) return null; let u; try{ u=new URL(C.CHECKOUT_URL); }catch(e){ return C.CHECKOUT_URL; }
 S.lead.nome && u.searchParams.set('name', S.lead.nome); S.lead.email && u.searchParams.set('email', S.lead.email); S.lead.whats && u.searchParams.set('phone', S.lead.whats.replace(/\D/g,''));
 Object.entries(UTM).forEach(([k,v])=>u.searchParams.set(k,v)); u.searchParams.set('src', SESSION); return u.toString();
}

function bind(s){
 screenEl.querySelectorAll('.opt').forEach(el=>el.addEventListener('click',()=>{
  const v=el.dataset.v;
  if(s.k==='hero'){ S.a.sexo=v; track('ViewContent',{content_name:'Quiz Seca Barriga',content_category:'quiz_inicio'}); go(1); return; }
  if(s.k==='single'){ S.a[s.key]=v; render(); setTimeout(()=>{ if(s.key==='evento' && v==='Nada marcado') go(2); else go(1); },220); return; }
  if(s.k==='multi'){ let sel=S.m[s.key]||[]; if(s.none && v===s.none) sel = sel.includes(v)?[]:[v]; else { sel=sel.filter(x=>x!==s.none); sel = sel.includes(v)?sel.filter(x=>x!==v):sel.concat(v); } S.m[s.key]=sel; render(); }
 }));
 if(s.k==='num'){ const inp=$('#numin'); inp.focus(); inp.addEventListener('input',()=>{ S.a[s.key]=inp.value; nextBtn.disabled=!inp.value; $('#err').textContent=''; numNote(s); }); numNote(s); }
 if(s.k==='scratch' && !S.revealed) setTimeout(initScratch,30);
 if(s.k==='offer'){ startTimer(); track('ViewContent',{content_name:'Oferta Seca Barriga 21 Dias',content_category:'oferta',value:C.PRECO,currency:C.MOEDA}); sendLead('oferta'); }
}

function numNote(s){
 const box=$('#numnote'); if(!box) return; let t='';
 if(s.key==='w'){ const v=imc(); if(v) t = v>=25 ? `<div class="note"><b>Seu IMC é ${v.toFixed(1).replace('.',',')}</b>Está acima do ideal. O desafio foi feito exatamente para isso: secar a barriga sem passar fome.</div>` : `<div class="note" style="background:var(--green-soft)"><b>Seu IMC é ${v.toFixed(1).replace('.',',')}</b>Você está no peso normal. O foco vai ser desinchar e secar a barriga.</div>`; }
 if(s.key==='gw'){ const w=num('w'), g=num('gw'); if(w&&g&&g<w) t=`<div class="note" style="background:var(--green-soft)"><b>Meta: perder ${String(Math.round((w-g)*10)/10).replace('.',',')} kg</b>Os primeiros quilos vêm já no desafio de 21 dias.</div>`; }
 box.innerHTML=t;
}

function validNum(s){ const v=num(s.key); if(!(v>=s.min && v<=s.max)){ $('#err').textContent=`Digite um valor entre ${s.min} e ${s.max} ${s.unit}.`; return false; } if(s.key==='gw' && v>=num('w')){ $('#err').textContent='O peso desejado precisa ser menor que o atual.'; return false; } return true; }

nextBtn.addEventListener('click',()=>{
 const s=SCREENS[S.i];
 if(s.k==='num' && !validNum(s)) return;
 if(s.k==='date'){ S.a.data=$('#datein').value||''; }
 if(s.k==='capture'){
  const n=$('#nomein').value.trim(), e=$('#emailin').value.trim();
  if(n.length<2){ $('#err').textContent='Digite seu nome.'; return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)){ $('#err').textContent='Digite um e-mail válido.'; return; }
  S.lead.nome=n; S.lead.email=e.toLowerCase(); sendLead('email');
 }
 if(s.k==='whats'){
  const w=$('#whatsin').value.replace(/\D/g,''); if(w.length<10||w.length>11){ $('#err').textContent='Digite seu WhatsApp com DDD.'; return; }
  S.lead.whats='55'+w; sendLead('lead');
  if(window.fbq && C.PIXEL_ID){ try{ fbq('init', C.PIXEL_ID, {em:S.lead.email, ph:S.lead.whats, fn:nome1().toLowerCase(), external_id:SESSION}); }catch(e){} }
  track('Lead',{content_name:'Quiz Seca Barriga',value:C.PRECO,currency:C.MOEDA, tipo:tipo(), trava:trava()}, false, 'lead-'+SESSION);
  track('CompleteRegistration',{content_name:'Quiz Seca Barriga'}, false, 'reg-'+SESSION);
 }
 if(s.k==='offer'){
  track('InitiateCheckout',{value:C.PRECO,currency:C.MOEDA,content_name:'Desafio Seca Barriga 21 Dias',num_items:1}, false, 'ic-'+SESSION);
  sendLead('checkout');
  const u=checkoutUrl(); if(u){ setTimeout(()=>{ location.href=u; },250); } else { alert('Configure CHECKOUT_URL no topo do arquivo.'); }
  return;
 }
 go(1);
});
backBtn.addEventListener('click',()=>go(-1));

function go(d){
 let i=S.i+d;
 if(d<0){ while(i>0 && ['load','info'].includes(SCREENS[i].k) && SCREENS[i].id!=='tipo') i--; if(SCREENS[i] && SCREENS[i].k==='date' && S.a.evento==='Nada marcado') i--; }
 S.i=Math.max(0,Math.min(SCREENS.length-1,i)); render();
}

render();
})();
</script>
</body>
